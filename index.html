<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S4</title>
<style>
body { background: #0a0a1a; color: #fff; font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 24px; box-sizing: border-box; }
.bracket-container { display: flex; justify-content: center; align-items: center; gap: 30px; overflow-x: auto; min-height: calc(100vh - 48px); box-sizing: border-box; }
.bracket-container > div { margin: auto; }

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', 'Arial', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #fff;
}
.header {
    background: rgba(0,0,0,0.4);
    padding: 20px;
    border-bottom: 1px solid #00d4ff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}
.header h1 {
    font-size: 28px;
    background: linear-gradient(90deg, #00d4ff, #ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.3s;
}
.btn-import {
    background: linear-gradient(90deg, #00d4ff, #0099cc);
    color: #fff;
}
.btn-import:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0,212,255,0.4);
}
.btn-export {
    background: linear-gradient(90deg, #ff00ff, #cc00cc);
    color: #fff;
}
.btn-export:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(255,0,255,0.4);
}
.btn-reset {
    background: #444;
    color: #fff;
}
.btn-reset:hover {
    background: #555;
}
.btn-delete {
    background: linear-gradient(90deg, #ff4444, #cc0000);
    color: #fff;
}
.btn-delete:hover {
    background: linear-gradient(90deg, #ff6666, #ff0000);
}
.search-box {
    padding: 10px 15px;
    border: 1px solid #333;
    border-radius: 5px;
    background: #0f0f23;
    color: #fff;
    font-size: 14px;
    width: 200px;
    transition: border-color 0.3s;
}
.search-box:focus {
    border-color: #00d4ff;
    outline: none;
}
.view-mode-badge {
    padding: 6px 12px;
    background: #e74c3c;
    color: #fff;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
}
.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}
.rank-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}
.rank-tab {
    padding: 10px 25px;
    background: #222;
    color: #ccc;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s;
}
.rank-tab:hover {
    background: #333;
}
.rank-tab.active {
    background: linear-gradient(135deg, #00d4ff, #0099cc);
    color: #000;
    font-weight: bold;
}
.rank-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    overflow: hidden;
}
.rank-table th, .rank-table td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.rank-table th {
    background: rgba(0,0,0,0.5);
    color: #00d4ff;
    font-weight: bold;
}
.rank-table tr:hover {
    background: rgba(0,212,255,0.1);
    cursor: pointer;
}
.rank-table tr:nth-child(1) td,
.rank-table tr:nth-child(2) td,
.rank-table tr:nth-child(3) td {
    background: rgba(255,215,0,0.1);
}
.rank-table tr:nth-child(1):hover,
.rank-table tr:nth-child(2):hover,
.rank-table tr:nth-child(3):hover {
    background: rgba(255,215,0,0.2);
}
.rank-num {
    width: 60px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}
.rank-num.gold { color: #ffd700; }
.rank-num.silver { color: #c0c0c0; }
.rank-num.bronze { color: #cd7f32; }
.team-cell {
    display: flex;
    align-items: flex-start;
    gap: 12px;
}
.team-logo {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    object-fit: cover;
    background: #333;
    flex-shrink: 0;
}
.team-info {
    display: flex;
    flex-direction: column;
}
.rating-D { color: #888; }
.rating-C { color: #4CAF50; }
.rating-B { color: #2196F3; }
.rating-A { color: #FF9800; }
.rating-S { color: #E91E63; }
.rating-SS { color: #9C27B0; }
.rating-SSS { color: #FFEB3B; text-shadow: 0 0 8px #FFEB3B; }
.team-name {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 4px;
}
.team-events {
    font-size: 12px;
    color: #aaa;
    max-width: 300px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.points {
    font-weight: bold;
    color: #00ff88;
    font-size: 16px;
    width: 80px;
}
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal.active {
    display: flex;
}
.modal-content {
    background: #1a1a2e;
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    border: 1px solid #00d4ff;
    box-shadow: 0 0 30px rgba(0,212,255,0.3);
}
.modal-content h2 {
    margin-bottom: 20px;
    color: #00d4ff;
}
.form-group {
    margin-bottom: 15px;
}
.form-group label {
    display: block;
    margin-bottom: 5px;
    color: #aaa;
    font-size: 13px;
}
.form-group input,
.form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #333;
    border-radius: 5px;
    background: #0f0f23;
    color: #fff;
    font-size: 14px;
    transition: border-color 0.3s;
}
.form-group input:focus,
.form-group textarea:focus {
    border-color: #00d4ff;
    outline: none;
}
.form-group textarea {
    resize: vertical;
    min-height: 80px;
}
.file-input-wrapper {
    position: relative;
    overflow: hidden;
    display: inline-block;
}
.file-input-wrapper input[type=file] {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
}
.file-input-btn {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid #333;
    border-radius: 5px;
    background: #0f0f23;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.3s;
}
.file-input-btn:hover {
    border-color: #00d4ff;
}
.logo-preview-container {
    margin-top: 10px;
    position: relative;
    display: none;
    border-radius: 6px;
    overflow: hidden;
    background: #0f0f23;
    border: 1px solid #333;
}
.logo-preview-canvas {
    width: 150px;
    height: 150px;
    display: block;
    overflow: hidden;
    position: relative;
    background: #0f0f23;
}
.logo-preview-canvas img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}
.remove-img-btn {
    position: absolute;
    top: -1px;
    right: -1px;
    width: 24px;
    height: 24px;
    background: #e74c3c;
    border: 1px solid #c0392b;
    border-radius: 0 6px 0 4px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: all 0.2s;
}
.remove-img-btn:hover {
    background: #c0392b;
    transform: scale(1.1);
}
.logo-controls {
    padding: 10px;
    border-top: 1px solid #333;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.logo-control-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #aaa;
}
.logo-control-row label {
    min-width: 50px;
    margin-bottom: 0;
}
.logo-control-row input[type=number] {
    width: 60px;
    background: #0f0f23;
    color: #00d4ff;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 4px;
    font-size: 12px;
    text-align: center;
}
.logo-control-row select {
    background: #0f0f23;
    color: #fff;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 4px;
    font-size: 12px;
    cursor: pointer;
}
.logo-control-row span {
    min-width: 30px;
    text-align: right;
    color: #00d4ff;
}
.logo-canvas-hint {
    font-size: 11px;
    color: #666;
    text-align: center;
}
.players-section {
    margin-top: 10px;
}
.players-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
}
.player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    background: #0f0f23;
    border: 1px solid #333;
    border-radius: 6px;
}
.player-avatar-wrapper {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid #444;
    transition: all 0.3s;
    flex-shrink: 0;
    background: #333;
}
.player-avatar-wrapper:hover {
    border-color: #00d4ff;
    transform: scale(1.05);
}
.player-avatar-wrapper:hover::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,212,255,0.2);
}
.player-avatar-wrapper.has-avatar:hover::after {
    display: none;
}
.avatar-remove {
    width: 18px;
    height: 18px;
    font-size: 12px;
    border-radius: 0 50% 0 50%;
    top: -2px;
    right: -2px;
}
.player-avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.player-avatar-input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    z-index: 10;
}
.player-name-input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #333;
    border-radius: 4px;
    background: #0f0f23;
    color: #fff;
    font-size: 13px;
}
.player-name-input:focus {
    border-color: #00d4ff;
    outline: none;
}
.player-remove {
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 4px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
    transition: background 0.3s;
}
.player-remove:hover {
    background: #c0392b;
}
.player-profile-btn {
    background: #00d4ff;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 5px;
}
.player-profile-btn:hover {
    background: #0099cc;
}
.player-add-btn {
    margin-top: 8px;
    padding: 8px;
    background: #0f0f23;
    color: #00d4ff;
    border: 1px dashed #00d4ff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
    transition: all 0.3s;
}
.player-add-btn:hover {
    background: rgba(0,212,255,0.1);
}
.team-players {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    flex-wrap: wrap;
}
.team-player-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #444;
}
.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}
.share-code {
    margin-top: 20px;
    padding: 15px;
    background: #0f0f23;
    border-radius: 5px;
    word-break: break-all;
    font-family: monospace;
    font-size: 13px;
    color: #00ff88;
}
.copy-btn {
    margin-top: 10px;
    background: #00ff88;
    color: #000;
}
.copy-btn:hover {
    background: #00cc6a;
}
.toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 15px 25px;
    background: #00ff88;
    color: #000;
    border-radius: 5px;
    font-weight: bold;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s;
    z-index: 2000;
}
.toast.show {
    opacity: 1;
    transform: translateY(0);
}
@media (max-width: 768px) {
    .header h1 { font-size: 20px; }
    .rank-table th, .rank-table td { padding: 8px 5px; font-size: 12px; }
    .team-logo { width: 36px; height: 36px; }
    .team-name { font-size: 14px; }
    .team-events { display: none; }
}
.login-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}
.login-container {
    background: rgba(26, 26, 46, 0.95);
    padding: 40px;
    border-radius: 15px;
    width: 100%;
    max-width: 450px;
    border: 1px solid #00d4ff;
    box-shadow: 0 0 40px rgba(0,212,255,0.3);
}
.login-container h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #00d4ff;
    font-size: 24px;
}
.login-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.login-form .form-group {
    margin-bottom: 0;
}
.login-form label {
    display: block;
    margin-bottom: 5px;
    color: #aaa;
    font-size: 13px;
}
.login-form input {
    width: 100%;
    padding: 12px;
    border: 1px solid #333;
    border-radius: 5px;
    background: #0f0f23;
    color: #fff;
    font-size: 14px;
    transition: border-color 0.3s;
}
.login-form input:focus {
    border-color: #00d4ff;
    outline: none;
}
.login-form .btn {
    width: 100%;
    padding: 12px;
    font-size: 16px;
}
.login-switch {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
    color: #aaa;
}
.login-switch a {
    color: #00d4ff;
    cursor: pointer;
    text-decoration: underline;
}
.login-switch a:hover {
    color: #00ff88;
}
.captcha-box {
    display: flex;
    gap: 10px;
    align-items: center;
}
.captcha-box input {
    flex: 1;
}
.captcha-code {
    padding: 10px 15px;
    background: #0f0f23;
    border: 1px solid #333;
    border-radius: 5px;
    font-family: monospace;
    font-size: 18px;
    font-weight: bold;
    color: #00d4ff;
    letter-spacing: 3px;
    cursor: pointer;
    user-select: none;
}
.captcha-code:hover {
    border-color: #00d4ff;
}
.user-avatar-preview {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 15px;
    display: block;
    background: #333;
    border: 2px solid #444;
    cursor: pointer;
}
.user-avatar-preview:hover {
    border-color: #00d4ff;
}
.logged-user {
    display: flex;
    align-items: center;
    gap: 10px;
}
.logged-user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #00d4ff;
}
.logged-user-name {
    font-size: 14px;
    color: #00d4ff;
}
.tournament-modal {
    width: 90%;
    max-width: 900px;
}
.tournament-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 1px solid #333;
}
.tournament-tab {
    padding: 10px 20px;
    border: none;
    background: none;
    color: #aaa;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
}
.tournament-tab.active {
    color: #00d4ff;
    border-bottom-color: #00d4ff;
}
.tournament-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
    max-height: 500px;
    overflow-y: auto;
}
.tournament-card {
    background: #0f0f23;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #333;
    transition: all 0.3s;
}
.tournament-card:hover {
    border-color: #00d4ff;
    transform: translateY(-2px);
}
.tournament-card-img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    background: #333;
}
.tournament-card-body {
    padding: 15px;
}
.tournament-card-title {
    font-size: 16px;
    font-weight: bold;
    color: #00d4ff;
    margin-bottom: 10px;
}
.tournament-card-info {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 5px;
}
.tournament-card-status {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
    margin-top: 10px;
}
.status-upcoming {
    background: #3498db;
    color: #fff;
}
.status-active {
    background: #2ecc71;
    color: #fff;
}
.status-ended {
    background: #95a5a6;
    color: #fff;
}
.tournament-action-btn {
    margin-top: 10px;
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
    width: 100%;
    transition: all 0.3s;
}
.tournament-action-btn.register {
    background: #00d4ff;
    color: #fff;
}
.tournament-action-btn.register:hover {
    background: #0099cc;
}
.tournament-action-btn.unregister {
    background: #e74c3c;
    color: #fff;
}
.tournament-action-btn.unregister:hover {
    background: #c0392b;
}
.tournament-action-btn.disabled {
    background: #555;
    cursor: not-allowed;
}
.registered-teams {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #333;
}
.registered-teams-title {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 5px;
}
.registered-team-tag {
    display: inline-block;
    padding: 2px 6px;
    background: rgba(0,212,255,0.2);
    border-radius: 3px;
    font-size: 11px;
    color: #00d4ff;
    margin-right: 5px;
    margin-bottom: 5px;
}
.tournament-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.tournament-form-grid .form-group {
    margin-bottom: 0;
}
.player-profile-modal {
    width: 90%;
    max-width: 600px;
}
.player-profile-header {
    text-align: center;
    margin-bottom: 20px;
}
.player-profile-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #00d4ff;
    margin-bottom: 10px;
}
.player-profile-name {
    font-size: 24px;
    color: #fff;
    margin-bottom: 5px;
}
.player-profile-team {
    font-size: 14px;
    color: #00d4ff;
}
.player-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}
.player-stat-item {
    background: #0f0f23;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
}
.player-stat-label {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 5px;
}
.player-stat-value {
    font-size: 20px;
    font-weight: bold;
    color: #00d4ff;
}
.player-stat-value.win {
    color: #00ff88;
}
.player-stat-value.loss {
    color: #e74c3c;
}
.player-stat-value.rate {
    color: #ffd700;
}
.match-list {
    max-height: 300px;
    overflow-y: auto;
}
.match-item {
    background: #0f0f23;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 10px;
    border-left: 3px solid;
}
.match-item.win {
    border-left-color: #00ff88;
}
.match-item.loss {
    border-left-color: #e74c3c;
}
.match-item.draw {
    border-left-color: #ffd700;
}
.match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
}
.match-tournament {
